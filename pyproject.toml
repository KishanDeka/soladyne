[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "solar-dynamo-cpp"
version = "0.2.0"
description = "Exact object-oriented C++/Python port of the SURYA dynamo v3 solver"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Kishan Deka"}]
dependencies = [
  "numpy>=1.26",
  "matplotlib>=3.8",
  "pillow>=10.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.38", "plotly>=5.24"]
test = ["pytest>=8.0", "pytest-cov>=5.0"]
dev = ["ruff>=0.6", "mypy>=1.11"]

[project.scripts]
solar-dynamo = "solar_dynamo.cli:main"

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["python/solar_dynamo"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
